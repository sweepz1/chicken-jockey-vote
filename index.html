<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Jockey Number of the Year</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Archivo+Black&display=swap');
  :root{
    --bg:#0a0a0d;
    --card:#151519;
    --card-hover:#1e1e24;
    --accent:#ffb100;
    --accent2:#ff3b30;
    --text:#f2f2f2;
    --muted:#8a8a92;
    --border:#2a2a30;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f4f6;
      --card:#ffffff;
      --card-hover:#f0f0f2;
      --text:#111114;
      --muted:#6b6b72;
      --border:#e0e0e4;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0a0d; --card:#151519; --card-hover:#1e1e24; --text:#f2f2f2; --muted:#8a8a92; --border:#2a2a30;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{text-align:center;margin-bottom:28px;}
  h1{
    font-size:1.8rem;
    margin:0 0 6px;
    letter-spacing:-0.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  p.sub{color:var(--muted);margin:0;font-size:0.95rem;}

  .tabs{display:flex;gap:8px;justify-content:center;margin:18px 0 24px;flex-wrap:wrap;}
  .tab{
    padding:6px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--card);color:var(--muted);font-size:0.85rem;cursor:pointer;
    transition:all .15s;
  }
  .tab.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600;}

  .grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:520px){.grid{grid-template-columns:1fr 1fr;}}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    cursor:pointer;
    transition:transform .12s, background .12s, border-color .12s;
    position:relative;
    overflow:hidden;
  }
  .card:active{transform:scale(0.97);}
  .card:hover{background:var(--card-hover);border-color:var(--accent);}
  .card.voted{border-color:var(--accent2);}
  .card.locked{opacity:.45;cursor:not-allowed;}
  .card.locked:hover{background:var(--card);border-color:var(--border);}
  .brand{
    font-size:0.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;
  }
  .model{
    font-size:1.15rem;font-weight:700;margin:0 0 10px;
  }
  .barbg{
    height:8px;border-radius:6px;background:var(--border);overflow:hidden;margin-bottom:8px;
  }
  .barfill{
    height:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    width:0%;
    transition:width .3s ease;
  }
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:0.8rem;color:var(--muted);}
  .votebtn{
    font-size:0.78rem;padding:4px 10px;border-radius:8px;border:1px solid var(--accent);
    background:transparent;color:var(--accent);cursor:pointer;font-weight:600;
  }
  .votebtn.active{background:var(--accent);color:#111;}

  .leaderboard{
    margin-top:32px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 16px 20px;
    overflow:hidden;
  }
  .leaderboard h2{margin:0 0 16px;font-size:1.05rem;text-align:center;}

  @keyframes lbFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes lbGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(255,177,0,.55);}
    50%{box-shadow:0 0 18px 4px rgba(255,177,0,.55);}
  }

  .podium{
    display:flex;align-items:flex-end;justify-content:center;gap:8px;
    margin-bottom:18px;padding:0 2px;
  }
  .podium-spot{
    display:flex;flex-direction:column;align-items:center;
    width:32%;max-width:160px;
    animation:lbFade .35s ease;
  }
  .podium-medal{font-size:1.7rem;line-height:1;margin-bottom:4px;}
  .podium-name{
    font-weight:800;font-size:0.82rem;text-align:center;margin-bottom:2px;
    line-height:1.15;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

    font-size:0.65rem;color:var(--muted);text-align:center;margin-bottom:6px;
