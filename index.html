<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Jockey Number of the Year</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Archivo+Black&display=swap');
  :root{
    --bg:#0a0a0d;
    --card:#151519;
    --card-hover:#1e1e24;
    --accent:#ffb100;
    --accent2:#ff3b30;
    --text:#f2f2f2;
    --muted:#8a8a92;
    --border:#2a2a30;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f4f6;
      --card:#ffffff;
      --card-hover:#f0f0f2;
      --text:#111114;
      --muted:#6b6b72;
      --border:#e0e0e4;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0a0d; --card:#151519; --card-hover:#1e1e24; --text:#f2f2f2; --muted:#8a8a92; --border:#2a2a30;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{text-align:center;margin-bottom:28px;}
  h1{
    font-size:1.8rem;
    margin:0 0 6px;
    letter-spacing:-0.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  p.sub{color:var(--muted);margin:0;font-size:0.95rem;}

  .tabs{display:flex;gap:8px;justify-content:center;margin:18px 0 24px;flex-wrap:wrap;}
  .tab{
    padding:6px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--card);color:var(--muted);font-size:0.85rem;cursor:pointer;
    transition:all .15s;
  }
  .tab.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600;}

  .grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:520px){.grid{grid-template-columns:1fr 1fr;}}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    cursor:pointer;
    transition:transform .12s, background .12s, border-color .12s;
    position:relative;
    overflow:hidden;
  }
  .card:active{transform:scale(0.97);}
  .card:hover{background:var(--card-hover);border-color:var(--accent);}
  .card.voted{border-color:var(--accent2);}
  .card.locked{opacity:.45;cursor:not-allowed;}
  .card.locked:hover{background:var(--card);border-color:var(--border);}
  .brand{
    font-size:0.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;
  }
  .model{
    font-size:1.15rem;font-weight:700;margin:0 0 10px;
  }
  .barbg{
    height:8px;border-radius:6px;background:var(--border);overflow:hidden;margin-bottom:8px;
  }
  .barfill{
    height:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    width:0%;
    transition:width .3s ease;
  }
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:0.8rem;color:var(--muted);}
  .votebtn{
    font-size:0.78rem;padding:4px 10px;border-radius:8px;border:1px solid var(--accent);
    background:transparent;color:var(--accent);cursor:pointer;font-weight:600;
  }
  .votebtn.active{background:var(--accent);color:#111;}

  .leaderboard{
    margin-top:32px;
    background:linear-gradient(165deg,var(--card),var(--card-hover));
    border:1px solid var(--border);border-radius:20px;padding:20px 18px 22px;
    overflow:hidden;position:relative;
    box-shadow:0 14px 34px -16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .leaderboard::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
  }
  .leaderboard.leaderboard-top{margin-top:0;margin-bottom:24px;}
  .leaderboard h2{
    margin:2px 0 18px;font-size:1.25rem;font-weight:800;text-align:center;letter-spacing:.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  @keyframes lbFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes lbGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(255,177,0,.55);}
    50%{box-shadow:0 0 20px 5px rgba(255,177,0,.55);}
  }
  @keyframes crownFloat{
    0%,100%{transform:translateY(0) rotate(-4deg);}
    50%{transform:translateY(-3px) rotate(4deg);}
  }

  .podium{
    display:flex;align-items:flex-end;justify-content:center;gap:10px;
    margin-bottom:20px;padding:0 4px;
  }
  .podium-spot{
    display:flex;flex-direction:column;align-items:center;
    width:32%;max-width:170px;
    animation:lbFade .4s ease;
  }
  .podium-1::before{
    content:"👑";display:block;font-size:1.4rem;margin-bottom:2px;
    animation:crownFloat 2.2s ease-in-out infinite;
  }
  .podium-medal{
    font-size:1.7rem;line-height:1;margin-bottom:6px;
    width:52px;height:52px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.25), rgba(255,255,255,0) 60%), var(--card-hover);
    border:2px solid var(--border);
    box-shadow:0 4px 10px rgba(0,0,0,.25);
    overflow:hidden;
  }
  .podium-medal img{
    width:100%;height:100%;object-fit:cover;object-position:center 30%;
    display:block;
  }
  .podium-name{
    font-weight:800;font-size:0.84rem;text-align:center;margin-bottom:2px;
    line-height:1.2;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .podium-brand{
    font-size:0.62rem;color:var(--muted);text-align:center;margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.08em;font-weight:600;
  }
  .podium-votes{
    font-weight:800;font-size:0.9rem;margin-bottom:10px;white-space:nowrap;
    background:var(--bg);color:var(--accent);
    padding:3px 11px;border-radius:999px;border:1px solid var(--border);
  }
  .podium-block{
    width:100%;border-radius:14px 14px 6px 6px;
    display:flex;align-items:flex-start;justify-content:center;padding-top:10px;
    font-weight:900;color:#111;font-size:1.1rem;
    transition:height .35s ease;
    box-shadow:inset 0 2px 4px rgba(255,255,255,.35), inset 0 -6px 10px rgba(0,0,0,.15);
  }
  .podium-1{order:2;transform:scale(1.08);z-index:2;}
  .podium-2{order:1;}
  .podium-3{order:3;}
  .podium-1 .podium-medal{
    width:64px;height:64px;font-size:2.2rem;
    border-color:var(--accent);box-shadow:0 6px 16px rgba(255,177,0,.4);
  }
  .podium-1 .podium-name{font-size:0.98rem;}
  .podium-1 .podium-votes{font-size:1.05rem;border-color:var(--accent);}
  .podium-1 .podium-block{
    height:120px;
    background:linear-gradient(180deg,#ffe27a,var(--accent) 55%,#c97e00);
    animation:lbGlow 2.2s ease-in-out infinite;
  }
  .podium-2 .podium-block{
    height:88px;
    background:linear-gradient(180deg,#eaeaee,#b9b9c0 60%,#8f8f96);
  }
  .podium-3 .podium-block{
    height:66px;
    background:linear-gradient(180deg,#f0b579,var(--accent2) 70%,#a13b32);
    color:#fff;
  }

  .lbrest{
    display:flex;flex-direction:column;gap:8px;
    padding-top:16px;border-top:1px dashed var(--border);
  }
  .lbrow{
    display:flex;align-items:center;gap:12px;padding:10px 12px;
    background:var(--bg);border:1px solid var(--border);border-radius:12px;
    font-size:0.88rem;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    animation:lbFade .35s ease;
  }
  .lbrow:hover{transform:translateX(4px);border-color:var(--accent);}
  .lbrank{
    width:28px;height:28px;flex-shrink:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--card-hover);color:var(--muted);font-weight:800;font-size:0.75rem;
    border:1px solid var(--border);
  }
  .lbname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
  .lbvotes{
    color:var(--accent);font-weight:800;white-space:nowrap;font-size:0.82rem;
    background:var(--card-hover);padding:4px 11px;border-radius:999px;
  }

  @media(max-width:420px){
    .podium-medal{width:42px;height:42px;font-size:1.3rem;}
    .podium-1 .podium-medal{width:54px;height:54px;font-size:1.9rem;}
    .podium-name{font-size:0.72rem;}
    .podium-1 .podium-name{font-size:0.84rem;}
    .podium-votes{font-size:0.76rem;padding:2px 8px;}
    .podium-1 .podium-votes{font-size:0.92rem;}
    .podium-1 .podium-block{height:96px;}
    .podium-2 .podium-block{height:70px;}
    .podium-3 .podium-block{height:54px;}
  }

  .addform{
    margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;
  }
  .addform input{
    flex:1;min-width:140px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:0.9rem;
  }
  .addform button{
    padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:#111;font-weight:700;cursor:pointer;
  }
  .resetbtn{
    display:block;margin:28px auto 0;background:none;border:1px solid var(--border);color:var(--muted);
    padding:8px 14px;border-radius:10px;font-size:0.8rem;cursor:pointer;
  }

  .sticker{
    position:absolute;
    z-index:5;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));
    pointer-events:none;
  }
  .sticker-hero{
    width:78px;height:78px;object-fit:contain;
    transform:rotate(-8deg);
    margin-right:8px;
    vertical-align:middle;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));
  }
  .sticker-corner{
    position:fixed;
    bottom:14px;
    right:10px;
    width:80px;
    opacity:.9;
    transform:rotate(6deg);
    z-index:50;
  }
  h1{
    font-family:'Archivo Black', -apple-system, sans-serif;
    text-transform:uppercase;
  }
  .titlerow{
    display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  }
  .stamp{
    display:inline-block;
    font-family:'Bangers', cursive;
    letter-spacing:.03em;
    background:var(--accent2);
    color:#fff;
    padding:2px 10px;
    border-radius:6px;
    transform:rotate(-3deg);
    font-size:0.85rem;
    margin-top:8px;
  }
</style>
</head>

<script>
/* ====== FILL THESE IN AFTER YOU CREATE YOUR SUPABASE PROJECT ======
   Project Settings -> API -> Project URL, and the "anon public" key.  */
const SUPABASE_URL = "https://rvmmiolcsxvsdvzvrkwp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2bW1pb2xjc3h2c2R2enZya3dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3Nzc4NDAsImV4cCI6MjEwNTM1Mzg0MH0.TaoK6oaTGQKb347Ddycgma5PG6bgsK_3VhovZ2_tR0w";
/* =================================================================== */

const DB_CONFIGURED = SUPABASE_URL.startsWith("http");

// Plain fetch() calls to Supabase's REST API — no client library needed,
// which sidesteps a browser bug some mobile browsers hit with the
// @supabase/supabase-js package.
async function supaSelectVotes(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/votes?select=id,count`, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`
    }
  });
  if(!res.ok){
    const text = await res.text().catch(()=>"");
    throw new Error(`${res.status} ${res.statusText}${text ? " — " + text : ""}`);
  }
  return res.json();
}

async function supaIncrementVote(id){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_vote`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ row_id: id })
  });
  if(!res.ok){
    const text = await res.text().catch(()=>"");
    throw new Error(`${res.status} ${res.statusText}${text ? " — " + text : ""}`);
  }
}

const VOTED_KEY = "cj_voted_v1"; // which id THIS browser voted for (per-device lock)

// Real car model naming, reskinned as "Chicken Jockey" builds
let entries = [
  {brand:"Special Edition", model:"Baby Chicka M9 Ultra Rare"},
  {brand:"BMW", model:"Chicken Jockey M3"},
  {brand:"BMW", model:"Chicken Jockey M5"},
  {brand:"Mercedes-AMG", model:"Chicken Jockey C63"},
  {brand:"Mercedes-AMG", model:"Chicken Jockey E63 S"},
  {brand:"Audi", model:"Chicken Jockey RS6"},
  {brand:"Audi", model:"Chicken Jockey RS7"},
  {brand:"Ferrari", model:"Chicken Jockey 488 Pista"},
  {brand:"Ferrari", model:"Chicken Jockey SF90 Stradale"},
  {brand:"Ferrari", model:"Chicken Jockey 812 Superfast"},
  {brand:"Lamborghini", model:"Chicken Jockey Huracán"},
  {brand:"Lamborghini", model:"Chicken Jockey Aventador SVJ"},
  {brand:"Porsche", model:"Chicken Jockey 911 Turbo S"},
  {brand:"Porsche", model:"Chicken Jockey GT3 RS"},
  {brand:"Nissan", model:"Chicken Jockey GT-R Nismo"},
  {brand:"Toyota", model:"Chicken Jockey Supra GR"},
  {brand:"Honda", model:"Chicken Jockey Civic Type R"},
  {brand:"Ford", model:"Chicken Jockey Mustang GT500"},
  {brand:"Chevrolet", model:"Chicken Jockey Corvette Z06"}
];

// give each a stable id
entries.forEach(e => e.id = (e.brand + "_" + e.model).replace(/\s+/g,"_"));

let votes = {};       // id -> shared count, pulled from Supabase
let votedId = null;   // this browser's locked-in pick (local only)

function loadVotedFlag(){
  try{
    const vo = localStorage.getItem(VOTED_KEY);
    votedId = vo ? JSON.parse(vo) : null;
  }catch(e){ votedId = null; }
}
function saveVotedFlag(){
  try{ localStorage.setItem(VOTED_KEY, JSON.stringify(votedId)); }catch(e){}
}

entries.forEach(e => { votes[e.id] = 0; });

async function fetchVotes(){
  if(!DB_CONFIGURED) return; // not configured yet
  let data;
  try{
    data = await supaSelectVotes();
  }catch(err){
    showStatus("Can't load votes: " + err.message);
    return;
  }
  clearStatus();
  const fresh = {};
  entries.forEach(e => fresh[e.id] = 0);
  (data||[]).forEach(row => { fresh[row.id] = row.count; });
  votes = fresh;
  render();
}

function showStatus(msg){
  const el = document.getElementById("statusMsg");
  if(!el) return;
  el.textContent = msg;
  el.style.display = "block";
}
function clearStatus(){
  const el = document.getElementById("statusMsg");
  if(!el) return;
  el.style.display = "none";
}

let activeBrand = "All";

function render(){
  const brands = ["All", ...new Set(entries.map(e=>e.brand))];
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  brands.forEach(b => {
    const t = document.createElement("div");
    t.className = "tab" + (b===activeBrand ? " active" : "");
    t.textContent = b;
    t.onclick = () => { activeBrand = b; render(); };
    tabs.appendChild(t);
  });

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const maxVotes = Math.max(1, ...Object.values(votes));

  const filtered = (activeBrand === "All" ? entries : entries.filter(e=>e.brand===activeBrand))
    .slice()
    .sort((a,b) => (votes[b.id]||0) - (votes[a.id]||0));

  filtered.forEach(e => {
    const v = votes[e.id] || 0;
    const pct = Math.round((v / maxVotes) * 100);
    const isVoted = votedId === e.id;
    const locked = !!votedId; // this browser already cast its one vote

    const card = document.createElement("div");
    card.className = "card" + (isVoted ? " voted" : "") + (locked && !isVoted ? " locked" : "");
    card.onclick = () => toggleVote(e.id);
    card.innerHTML = `
      <div class="brand">${e.brand}</div>
      <div class="model">${e.model}</div>
      <div class="barbg"><div class="barfill" style="width:${pct}%"></div></div>
      <div class="meta">
        <span>${v} vote${v===1?"":"s"}</span>
        <span class="votebtn ${isVoted?"active":""}">${isVoted?"Voted ✓":(locked?"Locked":"Vote")}</span>
      </div>
    `;
    grid.appendChild(card);
  });

  renderLeaderboard();
}

async function toggleVote(id){
  // vote is locked in once cast on this device — no changing or unvoting
  if(votedId) return;
  if(!DB_CONFIGURED){
    showStatus("Voting isn't connected to the shared database yet — add your Supabase URL/key in the code.");
    return;
  }

  // optimistic UI update
  votes[id] = (votes[id]||0) + 1;
  votedId = id;
  saveVotedFlag();
  render();

  try{
    await supaIncrementVote(id);
    clearStatus();
  }catch(err){
    // roll back on failure
    votes[id] = Math.max(0, (votes[id]||0) - 1);
    votedId = null;
    saveVotedFlag();
    render();
    showStatus("Vote didn't go through: " + err.message);
  }

function renderLeaderboard(){
  const podiumEl = document.getElementById("podium");
  const restEl = document.getElementById("lb");
  const sorted = [...entries].sort((a,b) => (votes[b.id]||0) - (votes[a.id]||0));
  const top8 = sorted.slice(0,8);
  const top3 = top8.slice(0,3);

  // visual podium order: 2nd, 1st, 3rd (CSS `order` handles the actual
  // left-to-right placement — we just need each spot tagged with its rank)
  podiumEl.innerHTML = "";
  top3.forEach((e,i) => {
    const rank = i + 1;
    const v = votes[e.id] || 0;
    const spot = document.createElement("div");
    spot.className = `podium-spot podium-${rank}`;
    spot.innerHTML = `
      <div class="podium-medal"><img src="${MEDAL_IMAGES[i]}" alt="${e.model}"></div>
      <div class="podium-name">${e.model}</div>
      <div class="podium-brand">${e.brand}</div>
      <div class="podium-votes">${v} vote${v===1?"":"s"}</div>
      <div class="podium-block">#${rank}</div>
    `;
    podiumEl.appendChild(spot);
  });

  restEl.innerHTML = "";
  top8.slice(3,8).forEach((e,idx) => {
    const rank = idx + 4;
    const v = votes[e.id] || 0;
    const row = document.createElement("div");
    row.className = "lbrow";
    row.innerHTML = `
      <div class="lbrank">#${rank}</div>
      <div class="lbname">${e.model} <span style="color:var(--muted);font-size:0.75rem;">(${e.brand})</span></div>
      <div class="lbvotes">${v}</div>
    `;
    restEl.appendChild(row);
  });
}

loadVotedFlag();
render();
fetchVotes();
setInterval(fetchVotes, 4000); // poll so everyone sees live results
